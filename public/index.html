<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Logo Extractor — サイトからロゴを自動取得＆透過PNG変換</title>
  <meta name="description" content="URLを入力するだけで、Webサイトのロゴを自動検出し、透過PNGとしてダウンロードできます。SVG・JPG・PNGすべてに対応。">
  <link rel="stylesheet" href="/logo-extractor/style.css">
</head>
<body>
  <main class="app">
    <nav class="nav" aria-label="ナビゲーション">
      <a href="https://syslux-tech.com" class="nav__back">
        <svg width="12" height="20" viewBox="0 0 12 20" fill="none" aria-hidden="true">
          <path d="M10.5 1.5L2 10l8.5 8.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>syslux-tech.com</span>
      </a>
    </nav>

    <header class="hero" id="hero-section">
      <p class="hero__eyebrow">ツール</p>
      <h1 class="hero__title">Logo Extractor</h1>
      <p class="hero__subtitle">
        URLを入力するだけで、サイトのロゴを自動検出。<br>
        SVG・JPG・PNG — すべて<strong>透過PNG</strong>に変換してダウンロード。
      </p>
    </header>

    <section class="input-section" id="input-section" aria-label="URL入力">
      <form class="search-group" id="extract-form" autocomplete="off">
        <div class="search-field">
          <label class="visually-hidden" for="url-input">ウェブサイトのURL</label>
          <div class="search-field__icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.35-4.35"/>
            </svg>
          </div>
          <input
            type="text"
            id="url-input"
            class="search-field__input"
            placeholder="apple.com または https://…"
            required
            spellcheck="false"
            inputmode="url"
            enterkeyhint="search"
          >
        </div>
        <button type="submit" class="btn btn--primary" id="btn-extract">
          <span class="btn__label">ロゴを取得</span>
          <span class="btn__spinner" aria-hidden="true"></span>
        </button>
      </form>
      <p class="footnote" id="input-hint">ホームページのURLを入力してください</p>
    </section>

    <section class="state-section hidden" id="loading-section" aria-live="polite" aria-busy="true">
      <div class="state-panel">
        <div class="progress-ring" aria-hidden="true">
          <div class="progress-ring__spinner"></div>
        </div>
        <h2 class="state-panel__title">ロゴを検出中</h2>
        <p class="state-panel__status" id="loading-status">Webページを取得しています</p>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-track__bar" id="loading-progress-bar"></div>
        </div>
      </div>
    </section>

    <section class="state-section hidden" id="error-section" role="alert">
      <div class="state-panel">
        <div class="state-panel__symbol state-panel__symbol--error" aria-hidden="true">!</div>
        <h2 class="state-panel__title">取得に失敗しました</h2>
        <p class="state-panel__status" id="error-message"></p>
        <button type="button" class="btn btn--secondary" id="btn-retry">もう一度試す</button>
      </div>
    </section>

    <section class="results-section hidden" id="results-section">
      <div class="results-toolbar">
        <div>
          <h2 class="results-toolbar__title">検出されたロゴ</h2>
          <p class="results-toolbar__domain" id="results-domain"></p>
        </div>
        <button type="button" class="btn btn--plain" id="btn-new-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
          新しい検索
        </button>
      </div>
      <div class="results-grid" id="results-grid"></div>
      <div class="deep-search" id="deep-search">
        <p class="deep-search__text">正しいロゴが見つかりませんか？</p>
        <button type="button" class="btn btn--secondary" id="btn-deep-search">
          <span class="btn__label">さらに詳しく探す</span>
          <span class="btn__spinner" aria-hidden="true"></span>
        </button>
        <p class="deep-search__hint hidden" id="deep-search-hint"></p>
      </div>
    </section>

    <footer class="footer">
      <p>Logo Extractor</p>
    </footer>
  </main>

  <script src="/logo-extractor/app.js"></script>
</body>
</html>
